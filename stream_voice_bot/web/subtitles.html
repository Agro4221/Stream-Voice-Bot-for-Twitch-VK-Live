<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Voice Bot — Subtitles</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Arial,sans-serif;display:flex;align-items:flex-end;justify-content:center}
#sub{margin:0 4vw 5vh;padding:12px 22px;border-radius:14px;
background:rgba(0,0,0,.72);color:white;font-size:36px;line-height:1.15;
font-weight:700;text-align:center;text-shadow:0 2px 3px #000;max-width:88%;
opacity:0;transition:opacity .15s}
#sub.show{opacity:1}
</style>
</head>
<body>
<div id="sub"></div>
<div id="debug" style="display:none;position:fixed;left:10px;top:10px;right:10px;padding:8px;background:rgba(0,0,0,.85);color:#fff;font:14px/1.35 Arial,sans-serif;z-index:10"></div>
<script>
const parts = location.pathname.split("/").filter(Boolean);
const trackId = (parts.length > 1 ? parts[parts.length - 1] : "ru").toLowerCase();
let lastTs=0;
async function update(){
  const debug=document.getElementById('debug');
  const debugMode=new URLSearchParams(location.search).get('debug')==='1';
  try{
    // Read only this track. OBS does not need the full admin state payload.
    const r=await fetch('/api/subtitles/debug/'+encodeURIComponent(trackId),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const s=await r.json();
    const item=s.state || {};
    const rawText=String(item.text||'');
    const blocked=/(?:subtitles?\s+(?:made|created|provided)\s+by\b|\bdima\s*torzok\b)/i.test(rawText);
    const text=blocked ? '' : rawText;
    if(debugMode){
      debug.style.display='block';
      debug.textContent='track='+trackId+' · timestamp='+(item.timestamp||0)+' · text='+(text||'нет текста')+' · configured='+(s.tracks||[]).some(t=>String(t.id||'').toLowerCase()===trackId);
    }
    const ts=Number(item.timestamp||0);
    const el=document.getElementById('sub');
    if(!text && blocked){
      el.textContent='';
      el.classList.remove('show');
    }
    if(text && ts!==lastTs){
      lastTs=ts;
      el.textContent=text;
      el.classList.add('show');
      setTimeout(()=>{ if(lastTs===ts) el.classList.remove('show'); }, 6500);
    }
  }catch(e){
    if(debugMode){
      debug.style.display='block';
      debug.textContent='track='+trackId+' · ошибка Browser Source: '+e.message;
    }
  }
}
setInterval(update,250);
update();
</script>
</body>
</html>
