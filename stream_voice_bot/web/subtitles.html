<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Voice Bot — Subtitles</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Arial,sans-serif;display:flex;align-items:flex-end;justify-content:center}
#sub{margin:0 4vw 5vh;padding:12px 22px;border-radius:14px;
background:rgba(0,0,0,.72);color:white;font-size:36px;line-height:1.15;
font-weight:700;text-align:center;text-shadow:0 2px 3px #000;max-width:88%;
opacity:0;transition:opacity .15s}
#sub.show{opacity:1}
</style>
</head>
<body>
<div id="sub"></div>
<script>
const parts = location.pathname.split("/").filter(Boolean);
const trackId = (parts.length > 1 ? parts[parts.length - 1] : "ru").toLowerCase();
let lastTs=0;
async function update(){
  try{
    const r=await fetch('/api/state',{cache:'no-store'});
    const s=await r.json();
    const item=s.subtitle?.[trackId] || (trackId==='ru' ? s.subtitle?.ru : null) || {};
    const text=item.text||'';
    const ts=Number(item.timestamp||0);
    const el=document.getElementById('sub');
    if(text && ts!==lastTs){
      lastTs=ts;
      el.textContent=text;
      el.classList.add('show');
      setTimeout(()=>{ if(lastTs===ts) el.classList.remove('show'); }, 6500);
    }
  }catch(e){}
}
setInterval(update,250);
update();
</script>
</body>
</html>
