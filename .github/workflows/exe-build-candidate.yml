name: Build Windows EXE candidate

on:
  push:
    branches: ["exe-packaging-v1.1.9-release-candidate"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download bundled Silero model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest -Uri "https://models.silero.ai/models/tts/ru/v5_ru.pt" -OutFile "models\v5_ru.pt"
          if ((Get-Item "models\v5_ru.pt").Length -lt 1MB) {
            throw "Silero model download failed."
          }

      - name: Build portable EXE
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build_exe.ps1

      - name: Smoke-test packaged EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path ".\dist_release\StreamVoiceBot_1.1.9\StreamVoiceBot.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) {
                break
              }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8787/" -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) {
              $log = ".\dist_release\StreamVoiceBot_1.1.9\data\exe_startup.log"
              if (Test-Path $log) {
                Write-Host "=== exe_startup.log ==="
                Get-Content $log -ErrorAction SilentlyContinue
              }
              if ($process.HasExited) {
                throw "Packaged EXE exited before serving admin page. ExitCode=$($process.ExitCode)"
              }
              throw "Packaged EXE did not serve admin page on 127.0.0.1:8787 within 60 seconds."
            }
            Write-Host "Packaged EXE smoke test: OK"
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Inspect bundle size
        shell: pwsh
        run: |
          $root = Resolve-Path ".\dist_release\StreamVoiceBot_1.1.9"
          $total = (Get-ChildItem $root -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("Bundle size: {0:N2} GB" -f ($total / 1GB))
          Get-ChildItem $root -Recurse -File | Sort-Object Length -Descending | Select-Object -First 20 @{Name="GB";Expression={[math]::Round($_.Length/1GB,2)}}, @{Name="Path";Expression={$_.FullName}} | Format-Table -AutoSize

      - name: Upload EXE candidate
        uses: actions/upload-artifact@v4
        with:
          name: StreamVoiceBot_1.1.9-windows-candidate
          path: dist_release/StreamVoiceBot_1.1.9
          if-no-files-found: error
          retention-days: 7
