name: Publish GitHub Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -n "$version"

      - name: Update repository description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PATCH "repos/${{ github.repository }}" \
            -f description='Local Windows stream assistant: Twitch + VK Video Live, Silero TTS, OBS/VB-CABLE, optional faster-whisper STT and subtitle tracks.' \
            >/dev/null 2>&1 || true

      - name: Download tested Windows EXE candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run download 35851044058 \
            --repo "${{ github.repository }}" \
            --name StreamVoiceBot-windows-candidate \
            --dir release-root
          test -f "release-root/StreamVoiceBot_1.1.11/StreamVoiceBot.exe"

      - name: Create Windows release ZIP
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          zip="StreamVoiceBot_${version}_Windows_x64.zip"
          rm -f "$zip" "$zip.sha256"
          7z a -tzip -mx=5 "$zip" "release-root/StreamVoiceBot_${version}" >/dev/null
          mv "release-root/StreamVoiceBot_${version}" "StreamVoiceBot_${version}"
          sha256sum "$zip" > "$zip.sha256"
          test -s "$zip"
          test -s "$zip.sha256"

      - name: Publish v1.1.11
        if: steps.version.outputs.version == '1.1.11'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          cat > release-notes.md <<'EOF'
# 🎙️ Stream Voice Bot v1.1.11

Локальный Windows-ассистент для стримов.

### Возможности
- 🔊 Silero V5 TTS с профилями «Обычная» / «Громкая»
- 🟣 Twitch EventSub и Channel Points
- 🔵 VK Видео Live chat bridge
- 🎧 VB-CABLE → OBS, 48 kHz stereo
- 🎤 faster-whisper STT: Авто (CUDA → CPU), GPU (NVIDIA CUDA), CPU int8
- 📝 Несколько OBS subtitle tracks
- 🌍 Локальный перевод через Argos Translate
- 🔐 Секреты Twitch/VK через Windows Credential Manager
- 📦 Компактная Windows portable EXE-сборка

### Установка
Распакуйте ZIP **целиком** и запускайте `StreamVoiceBot.exe`.
Для TTS требуется отдельно установленный VB-CABLE.

### STT
`CPU int8` не требует CUDA.
GPU-режим требует совместимый NVIDIA-драйвер и CUDA 12 runtime/cuDNN 9.

### OBS
Субтитры доступны через Browser Source, например:
`http://127.0.0.1:8787/subtitles/ru`

SHA-256 находится рядом с ZIP.
EOF
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "🎙️ Stream Voice Bot v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --latest \
            "StreamVoiceBot_${{ steps.version.outputs.version }}_Windows_x64.zip" \
            "StreamVoiceBot_${{ steps.version.outputs.version }}_Windows_x64.zip.sha256"