name: Publish GitHub Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -n "$version"

      - name: Find latest successful Windows candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          candidate_run="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow exe-build-candidate.yml \
            --branch exe-packaging-v1.1.9-release-candidate \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$candidate_run"
          echo "run_id=$candidate_run" >> "$GITHUB_OUTPUT"
          echo "Using successful Windows candidate run: $candidate_run"

      - name: Download tested Windows candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run download "${{ steps.candidate.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name StreamVoiceBot-windows-candidate \
            --dir release-root

          version="${{ steps.version.outputs.version }}"
          folder="StreamVoiceBot_$version"
          test -f "release-root/$folder/StreamVoiceBot.exe"

      - name: Package Windows build
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          folder="StreamVoiceBot_$version"
          zip="StreamVoiceBot_${version}_Windows_x64.zip"

          mv "release-root/$folder" "$folder"
          7z a -tzip -mx=5 "$zip" "$folder" >/dev/null
          sha256sum "$zip" > "$zip.sha256"

          test -s "$zip"
          test -s "$zip.sha256"

      - name: Update repository description (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api --method PATCH "repos/${{ github.repository }}" \
            -f description='Windows stream bot: Twitch + VK Video Live, Silero TTS, faster-whisper STT и OBS-субтитры. Сабы пока нестабильны; исправления в работе — я новичок ^_^' \
            >/dev/null 2>&1; then
            echo "Repository description updated."
          else
            echo "Repository description could not be updated by GITHUB_TOKEN; continuing release."
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          notes_file=".github/RELEASE_NOTES_$version.md"

          test -f "$notes_file"
          cp "$notes_file" release-notes.md

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists. Updating release notes."
            gh release edit "$tag" \
              --repo "${{ github.repository }}" \
              --title "🎙️ Stream Voice Bot v$version" \
              --notes-file release-notes.md
          else
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "🎙️ Stream Voice Bot v$version" \
              --notes-file release-notes.md \
              --latest \
              "StreamVoiceBot_${version}_Windows_x64.zip" \
              "StreamVoiceBot_${version}_Windows_x64.zip.sha256"
          fi
