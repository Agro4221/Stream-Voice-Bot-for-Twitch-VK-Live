name: Publish GitHub Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -n "$version"

      - name: Find successful Windows candidate for this version
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          candidate_branch="exe-packaging-v${version}-release-candidate"
          candidate_run=""
          current_sha="${{ github.sha }}"
          current_parents="$(git show -s --format=%P "$current_sha")"

          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue

            head_sha="$(gh run view "$run_id" --repo "${{ github.repository }}" --json headSha --jq '.headSha')"
            candidate_version="$(gh api \
              "repos/${{ github.repository }}/contents/VERSION?ref=$head_sha" \
              --jq '.content' | base64 -d | tr -d '\r\n')"

            if [ "$candidate_version" = "$version" ] && { [ "$head_sha" = "$current_sha" ] || printf "%s\n" "$current_parents" | tr " " "\n" | grep -Fxq "$head_sha"; }; then
              candidate_run="$run_id"
              break
            fi
          done < <(
            gh run list \
              --repo "${{ github.repository }}" \
              --workflow exe-build-candidate.yml \
              --branch "$candidate_branch" \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'
          )

          test -n "$candidate_run"
          echo "Candidate branch: $candidate_branch"
          candidate_head_sha="$(gh run view "$candidate_run" --repo "${{ github.repository }}" --json headSha --jq '.headSha')"
          echo "run_id=$candidate_run" >> "$GITHUB_OUTPUT"
          echo "head_sha=$candidate_head_sha" >> "$GITHUB_OUTPUT"
          echo "Using successful Windows candidate run: $candidate_run for version $version at commit $candidate_head_sha (current main commit or direct parent)"

      - name: Download tested Windows candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run download "${{ steps.candidate.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name StreamVoiceBot-windows-candidate \
            --dir release-root

          version="${{ steps.version.outputs.version }}"
          folder="StreamVoiceBot_$version"
          test -f "release-root/$folder/StreamVoiceBot.exe"

      - name: Package Windows build
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          folder="StreamVoiceBot_$version"
          zip="StreamVoiceBot_${version}_Windows_x64.zip"

          mv "release-root/$folder" "$folder"
          7z a -tzip -mx=5 "$zip" "$folder" >/dev/null
          sha256sum "$zip" > "$zip.sha256"

          test -s "$zip"
          test -s "$zip.sha256"

      - name: Update repository description (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api --method PATCH "repos/${{ github.repository }}" \
            -f description='Windows stream bot: Twitch + VK Video Live, Silero TTS, faster-whisper STT и OBS-субтитры. Сабы пока нестабильны; исправления в работе — я новичок ^_^' \
            >/dev/null 2>&1; then
            echo "Repository description updated."
          else
            echo "Repository description could not be updated by GITHUB_TOKEN; continuing release."
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          notes_file=".github/RELEASE_NOTES_$version.md"
          zip="StreamVoiceBot_${version}_Windows_x64.zip"
          checksum="$zip.sha256"

          test -f "$notes_file"
          cp "$notes_file" release-notes.md

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists. Updating notes and replacing Windows assets."
            gh release edit "$tag" \
              --repo "${{ github.repository }}" \
              --title "🎙️ Stream Voice Bot v$version" \
              --notes-file release-notes.md

            gh release upload "$tag" \
              --repo "${{ github.repository }}" \
              --clobber \
              "$zip" "$checksum"
          else
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "🎙️ Stream Voice Bot v$version" \
              --notes-file release-notes.md \
              --latest \
              "$zip" "$checksum"
          fi
