name: Publish GitHub Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -n "$version"

      - name: Download tested Windows candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run download 35851044058 --repo "${{ github.repository }}" --name StreamVoiceBot-windows-candidate --dir release-root
          test -f "release-root/StreamVoiceBot_1.1.11/StreamVoiceBot.exe"

      - name: Package Windows build
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          folder="StreamVoiceBot_${version}"
          zip="StreamVoiceBot_${version}_Windows_x64.zip"
          mv "release-root/$folder" "$folder"
          7z a -tzip -mx=5 "$zip" "$folder" >/dev/null
          sha256sum "$zip" > "$zip.sha256"
          test -s "$zip"

      - name: Publish release
        if: steps.version.outputs.version == '1.1.11'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          notes=$'# 🎙️ Stream Voice Bot v1.1.11\n\nЛокальный Windows-ассистент для стримов: Twitch + VK Видео Live, Silero TTS, OBS/VB-CABLE и опциональные STT-субтитры.\n\n## Возможности\n- 🔊 Silero V5 TTS\n- 🟣 Twitch EventSub / Channel Points\n- 🔵 VK Видео Live chat\n- 🎧 VB-CABLE → OBS, 48 kHz stereo\n- 🎤 STT: Авто (CUDA → CPU), GPU (NVIDIA CUDA), CPU int8\n- 📝 Много-дорожечные OBS-субтитры\n- 🌍 Argos Translate\n- 📦 Компактная Windows portable EXE-сборка\n\n## Установка\nРаспакуйте ZIP целиком и запустите StreamVoiceBot.exe. Для TTS требуется отдельно установленный VB-CABLE.\n\nSHA-256 опубликован рядом с ZIP.'
          printf '%s\n' "$notes" > release-notes.md
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "🎙️ Stream Voice Bot v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --latest \
            "StreamVoiceBot_${{ steps.version.outputs.version }}_Windows_x64.zip" \
            "StreamVoiceBot_${{ steps.version.outputs.version }}_Windows_x64.zip.sha256"