name: Publish GitHub Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -n "$version"

      - name: Download tested Windows EXE candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run download 35851044058 \
            --repo "${{ github.repository }}" \
            --name StreamVoiceBot-windows-candidate \
            --dir release-root
          test -f "release-root/StreamVoiceBot_1.1.11/StreamVoiceBot.exe"

      - name: Create Windows release package
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          folder="StreamVoiceBot_${version}"
          zip="StreamVoiceBot_${version}_Windows_x64.zip"
          rm -f "$zip" "$zip.sha256"
          mv "release-root/$folder" "$folder"
          7z a -tzip -mx=5 "$zip" "$folder" >/dev/null
          sha256sum "$zip" > "$zip.sha256"
          test -s "$zip"
          test -s "$zip.sha256"

      - name: Update repository description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PATCH "repos/${{ github.repository }}" \
            -f description='Local Windows stream assistant: Twitch + VK Video Live, Silero TTS, OBS/VB-CABLE, optional faster-whisper STT and subtitle tracks.' \
            >/dev/null 2>&1 || true

      - name: Publish release
        if: steps.version.outputs.version == '1.1.11'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          cat > release-notes.md <<'EOF'
# 🎙️ Stream Voice Bot v1.1.11

Локальный Windows-ассистент для стримов.

## Возможности

- 🔊 **Silero V5 TTS** — локальная озвучка, профили «Обычная» / «Громкая»
- 🟣 **Twitch** — Device Code Flow, EventSub и Channel Points
- 🔵 **VK Видео Live** — readonly chat bridge
- 🎧 **OBS + VB-CABLE** — 48 kHz stereo
- 🎤 **STT** — `Авто (CUDA → CPU)`, `GPU (NVIDIA CUDA)`, `CPU int8`
- 📝 **OBS-субтитры** — несколько независимых дорожек
- 🌍 **Argos Translate** — локальный перевод субтитров
- 🔐 Секреты Twitch/VK — Windows Credential Manager
- 📦 Компактная Windows portable EXE-сборка
- 🧪 Windows smoke-test и регрессионные проверки

## Установка

1. Скачайте `StreamVoiceBot_1.1.11_Windows_x64.zip`.
2. Распакуйте архив **целиком**.
3. Запустите `StreamVoiceBot.exe`.

Для TTS отдельно установите **VB-CABLE**.

## STT

CPU-режим работает без CUDA.
GPU-режим использует NVIDIA CUDA 12 runtime + cuDNN 9.

## OBS Browser Source

`http://127.0.0.1:8787/subtitles/ru`

Рядом с ZIP лежит файл `.sha256` с контрольной суммой.
EOF
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "🎙️ Stream Voice Bot v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --latest \
            "StreamVoiceBot_${{ steps.version.outputs.version }}_Windows_x64.zip" \
            "StreamVoiceBot_${{ steps.version.outputs.version }}_Windows_x64.zip.sha256"