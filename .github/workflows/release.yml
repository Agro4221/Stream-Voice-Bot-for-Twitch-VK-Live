name: Publish GitHub Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -n "$version"

      - name: Download tested Windows candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run download 35861679878 --repo "${{ github.repository }}" --name StreamVoiceBot-windows-candidate --dir release-root
          test -f "release-root/StreamVoiceBot_1.1.11/StreamVoiceBot.exe"

      - name: Package Windows build
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          folder="StreamVoiceBot_${version}"
          zip="StreamVoiceBot_${version}_Windows_x64.zip"
          mv "release-root/$folder" "$folder"
          7z a -tzip -mx=5 "$zip" "$folder" >/dev/null
          sha256sum "$zip" > "$zip.sha256"
          test -s "$zip"


      - name: Update repository description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PATCH "repos/${{ github.repository }}" \
            -f description='Локальный Windows-бот для стримов: Twitch + VK Video Live, Silero TTS, STT и OBS-субтитры. Сабы пока нестабильны — исправления в работе. Не судите строго: я новичок ^_^' \
            >/dev/null 2>&1 || true

      - name: Publish release
        if: steps.version.outputs.version == '1.1.11'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          notes="$(cat .github/RELEASE_NOTES_1.1.11.md)"
          printf '%s\n' "$notes" > release-notes.md
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists. Updating release notes."
            gh release edit "$tag" \
              --repo "${{ github.repository }}" \
              --title "🎙️ Stream Voice Bot v${{ steps.version.outputs.version }}" \
              --notes-file release-notes.md
          else
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "🎙️ Stream Voice Bot v${{ steps.version.outputs.version }}" \
              --notes-file release-notes.md \
              --latest \
              "StreamVoiceBot_${{ steps.version.outputs.version }}_Windows_x64.zip" \
              "StreamVoiceBot_${{ steps.version.outputs.version }}_Windows_x64.zip.sha256"
          fi
