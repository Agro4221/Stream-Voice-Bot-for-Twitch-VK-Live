name: Stream Voice Bot CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        shell: pwsh
        run: |
          python -m compileall -q stream_voice_bot
      - name: Core import check
        shell: pwsh
        run: |
          python -c "import stream_voice_bot.db; import stream_voice_bot.models"
      - name: Stability tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Dependency manifest check
        shell: pwsh
        run: |
          python -c "from pathlib import Path; assert Path('requirements.txt').exists()"
      - name: Secret scan
        shell: pwsh
        run: |
          $bad = git grep -n -I -E '(^|[^A-Za-z_])(client_secret|access_token|refresh_token|service_key|secure_key|password)[[:space:]]*[:=][[:space:]]*[''"'' ]?[A-Za-z0-9._-]{12,}' -- ':!*.lock' ':!SECURITY.md' ':!.gitignore'
          if ($LASTEXITCODE -eq 0 -and $bad) { Write-Host $bad; exit 1 }
  node:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: stream_voice_bot/vk_bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: stream_voice_bot/vk_bridge/package-lock.json
      - name: Install bridge
        run: npm ci
      - name: Syntax check bridge
        run: node --check bridge.js
